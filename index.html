<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PBA Líbano — Sala de Datos Municipal y Proyecto APP</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Sala de Datos Oficial del Activo Municipal y Proceso de Concesión APP - Planta de Beneficio Animal de Líbano, Tolima">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #1b5e20;
    }
    .app-name-link {
      font-weight: bold;
      font-size: 16px;
    }
    .sidebar {
      font-size: 14px;
    }
    .markdown-section {
      max-width: 900px;
    }
    table {
      display: table !important;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">Cargando Sala de Datos...</div>
  <script>
    window.$docsify = {
      name: 'PBA Líbano Data Room',
      repo: 'https://github.com/srbde/ruapp-data-room',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar en el data room...',
        noData: 'Sin resultados',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Error',
        successText: 'Copiado'
      },
      pagination: {
        previousText: 'Anterior',
        nextText: 'Siguiente',
        crossChapter: true
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
